[workspace]
resolver = "2"
members = ["crates/loadloom-core", "src-tauri"]

[workspace.package]
version = "0.4.5"
edition = "2021"
# 与 rust-toolchain.toml 固定的编译器一致；下调前需用 `cargo msrv --bisect` 实测。
rust-version = "1.98"
authors = ["LoadLoom contributors"]
license = "MIT"
repository = "https://github.com/CheerSaltman/loadloom"

# 工作区级 lint：`[lints] workspace = true` 让每个成员统一继承，仅收录不会误报的项。
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
# 已知会拖垮性能或掩盖错误的写法，直接禁止。
dbg_macro = "warn"
todo = "warn"


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
# 保留行号表，让崩溃回溯能定位到具体代码行（Windows 上符号在独立 .pdb 中，对 exe 体积影响很小）。
debug = "line-tables-only"
# 保持 unwind：Tokio 会捕获任务内的 panic 并只终止该任务，UI 得以存活并报错。
panic = "unwind"

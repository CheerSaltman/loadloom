name: Release

# 推 tag 即发布：构建 Windows 产物并挂到同名 Release 上。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build & publish (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验 tag 与 Cargo.toml 版本一致
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # 安装包文件名 LoadLoom_<版本>_x64-* 由 src-tauri/Cargo.toml 的 package.version
          # （继承工作区 version）决定，tag 则是发布流程的版本源。两者不一致时，
          # 构建出的文件名对不上后面的 gh release upload，必须在编译前就拦下。
          MANIFEST_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 Cargo.toml 的 $MANIFEST_VERSION 不一致"
            exit 1
          fi

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 质量门禁
        run: |
          cargo test --locked -p loadloom-core
          npm run typecheck

      - name: 构建原生安装包
        run: npm run desktop:build

      - name: 上传产物到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Release 不存在则创建；已存在则只补产物，不覆盖说明。
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "LoadLoom $GITHUB_REF_NAME" \
                 --notes "本次变更见 CHANGELOG.md。"

          # Portable build: cargo emits target/release/loadloom-desktop.exe, but on the
          # release page every asset follows the same LoadLoom_<version>_x64-* scheme.
          # The local build artifact keeps its original name.
          cp "target/release/loadloom-desktop.exe" \
             "target/release/LoadLoom_${VERSION}_x64-portable.exe"

          gh release upload "$GITHUB_REF_NAME" \
            "target/release/LoadLoom_${VERSION}_x64-portable.exe" \
            "target/release/bundle/nsis/LoadLoom_${VERSION}_x64-setup.exe" \
            "target/release/bundle/msi/LoadLoom_${VERSION}_x64_en-US.msi" \
            --clobber
